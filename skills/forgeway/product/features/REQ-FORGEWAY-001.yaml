acceptance_criteria:
  - A run without explicit external review or evaluation emits no reviewer, model, external CLI or project-history literals.
  - Repository identity, path, language and framework never select an evaluation implicitly.
  - The trigger Skill has no fixed Skill root, package roster, version, digest, executable or discovery command.
  - A missing capability returns capability-unavailable with an install-or-enable prompt and no guessed package or fallback.
  - Generic templates contain only synthetic identities, a neutral profile and project-native command placeholders.
  - Real project, account, model, CLI and external-review evidence is excluded from controlled source.
  - Portability validation rejects target, reviewer, model, CLI, host-path and fixed-Skill bindings in portable surfaces.
  - Plugin, Skill, Schema, semantic, link and synthetic-fixture checks pass together.
